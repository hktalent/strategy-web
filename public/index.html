<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>选股策略库 · 标签化检索</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2d3436; font-size: 14px; }
  .header { background: #fff; padding: 14px 24px; border-bottom: 1px solid #e4e7ed; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 18px; color: #2c3e50; }
  .header .stats { color: #7f8c8d; font-size: 12px; }
  .container { display: flex; min-height: calc(100vh - 56px); }
  .sidebar { width: 280px; background: #fff; border-right: 1px solid #e4e7ed; padding: 16px; overflow-y: auto; max-height: calc(100vh - 56px); position: sticky; top: 56px; }
  .main { flex: 1; padding: 20px 24px; }
  .toolbar { background: #fff; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=text] { padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 6px; width: 280px; font-size: 14px; }
  .toolbar select { padding: 8px; border: 1px solid #dcdfe6; border-radius: 6px; }
  .toolbar label { color: #606266; font-size: 13px; }
  .cat-block { margin-bottom: 14px; }
  .cat-title { font-weight: 600; color: #2c3e50; padding: 6px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .cat-title:hover { color: #409eff; }
  .cat-title .cnt { font-size: 11px; color: #909399; font-weight: normal; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 4px; }
  .tag { padding: 3px 10px; background: #ecf5ff; color: #409eff; border-radius: 12px; cursor: pointer; font-size: 12px; border: 1px solid #d9ecff; user-select: none; }
  .tag.active { background: #409eff; color: #fff; border-color: #409eff; }
  .tag:hover { opacity: 0.85; }
  .strategy-card { background: #fff; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; border: 1px solid #ebeef5; transition: box-shadow 0.2s; }
  .strategy-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .strategy-card .title { font-weight: 600; color: #303133; margin-bottom: 8px; line-height: 1.5; }
  .strategy-card .text { color: #606266; font-size: 13px; line-height: 1.6; max-height: 48px; overflow: hidden; cursor: pointer; transition: max-height 0.3s; }
  .strategy-card .text.expanded { max-height: 1000px; }
  .meta-row { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .badge-usage { background: #fef0f0; color: #f56c6c; }
  .badge-composite { background: #f0f9eb; color: #67c23a; font-weight: 600; }
  .badge-seg { background: #fdf6ec; color: #e6a23c; }
  .badge-fund { background: #ecf5ff; color: #409eff; }
  .source { font-size: 11px; color: #c0c4cc; }
  .score-bar { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #909399; }
  .score-bar .bar { width: 60px; height: 4px; background: #ebeef5; border-radius: 2px; overflow: hidden; }
  .score-bar .bar > div { height: 100%; background: #67c23a; }
  .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 20px; align-items: center; }
  .pagination button { padding: 6px 12px; border: 1px solid #dcdfe6; background: #fff; border-radius: 4px; cursor: pointer; }
  .pagination button:hover:not(:disabled) { color: #409eff; border-color: #409eff; }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .active-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .active-filters .tag { background: #fef0f0; color: #f56c6c; border-color: #fbc4c4; }
  .empty { text-align: center; padding: 60px; color: #909399; }
</style>
</head>
<body>
<div class="header">
  <h1>📊 选股策略库</h1>
  <div class="stats" id="stats"></div>
</div>

<div class="container">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="toolbar">
      <input type="text" id="q" placeholder="搜索策略文本，如：涨停 / ROE / 均线 ...">
      <label>排序
        <select id="sort">
          <option value="compositeScore">综合评分</option>
          <option value="usage">使用次数</option>
          <option value="segments">条件复杂度</option>
          <option value="diversityScore">标签多样性</option>
        </select>
      </label>
      <label>顺序
        <select id="order">
          <option value="desc">降序</option>
          <option value="asc">升序</option>
        </select>
      </label>
      <label>最低使用次数
        <select id="minUsage">
          <option value="0">不限</option>
          <option value="1">≥1</option>
          <option value="3">≥3</option>
          <option value="5">≥5</option>
          <option value="10">≥10</option>
          <option value="20">≥20</option>
        </select>
      </label>
      <button id="reset" style="padding:8px 14px;border:1px solid #dcdfe6;background:#fff;border-radius:6px;cursor:pointer;">重置</button>
    </div>

    <div class="active-filters" id="activeFilters" style="margin-bottom:12px;"></div>
    <div id="list"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script>
let META = null;
const state = {
  tags: new Set(),
  category: '',
  q: '',
  sort: 'compositeScore',
  order: 'desc',
  minUsage: 0,
  page: 1,
  pageSize: 30,
};

async function loadMeta() {
  const r = await fetch('/api/meta');
  META = await r.json();
  document.getElementById('stats').textContent =
    `共 ${META.totalStrategies.toLocaleString()} 条策略 · 累计使用 ${META.totalUsage.toLocaleString()} 次 · ${META.categories.length} 大类 · ${Object.keys(META.tagStats).length} 个标签`;
  renderSidebar();
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  // 全部大类快捷
  const all = document.createElement('div');
  all.className = 'cat-block';
  all.innerHTML = `<div class="cat-title" data-cat="">全部大类 <span class="cnt">${META.totalStrategies}</span></div>`;
  all.querySelector('.cat-title').onclick = () => { state.category=''; state.page=1; refresh(); };
  sb.appendChild(all);

  for (const cat of META.categories) {
    const block = document.createElement('div');
    block.className = 'cat-block';
    const tagsInCat = META.tagRules.filter(t => t.category === cat);
    block.innerHTML = `
      <div class="cat-title" data-cat="${cat}">
        ${cat} <span class="cnt">${META.catStats[cat] || 0}</span>
      </div>
      <div class="tag-list">
        ${tagsInCat.map(t => `
          <span class="tag ${state.tags.has(t.tag)?'active':''}" data-tag="${t.tag}">
            ${t.tag} <small style="opacity:0.7">${META.tagStats[t.tag]||0}</small>
          </span>`).join('')}
      </div>`;
    block.querySelector('.cat-title').onclick = () => {
      state.category = state.category === cat ? '' : cat;
      state.page = 1; refresh();
    };
    block.querySelectorAll('.tag').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const t = el.dataset.tag;
        state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t);
        state.page = 1; refresh();
      };
    });
    sb.appendChild(block);
  }
}

function renderActiveFilters() {
  const box = document.getElementById('activeFilters');
  let html = '';
  if (state.category) html += `<span class="tag" data-cat="${state.category}">大类: ${state.category} ✕</span>`;
  for (const t of state.tags) html += `<span class="tag" data-tag="${t}">${t} ✕</span>`;
  box.innerHTML = html;
  box.querySelectorAll('.tag').forEach(el => {
    el.onclick = () => {
      if (el.dataset.cat) state.category = '';
      if (el.dataset.tag) state.tags.delete(el.dataset.tag);
      state.page = 1; refresh();
    };
  });
}

async function refresh() {
  renderSidebar();
  renderActiveFilters();
  const params = new URLSearchParams({
    tags: [...state.tags].join(','),
    category: state.category,
    q: state.q,
    sort: state.sort,
    order: state.order,
    minUsage: state.minUsage,
    page: state.page,
    pageSize: state.pageSize,
  });
  const r = await fetch('/api/strategies?' + params);
  const data = await r.json();
  const list = document.getElementById('list');
  if (!data.list.length) {
    list.innerHTML = '<div class="empty">没有匹配的策略</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  list.innerHTML = data.list.map(s => `
    <div class="strategy-card">
      <div class="title">${s.title}</div>
      <div class="text" onclick="this.classList.toggle('expanded')">${s.text}</div>
      <div class="meta-row">
        <span class="badge badge-composite">综合 ${s.compositeScore}</span>
        <span class="badge badge-usage">使用 ${s.usage} 次</span>
        <span class="badge badge-seg">${s.segments} 个条件</span>
        ${s.hasFundamental ? '<span class="badge badge-fund">含财务</span>' : ''}
        <span class="badge" style="background:#f4f4f5;color:#71717a">${s.style}</span>
        <span class="badge" style="background:${s.riskLevel==='高'?'#fef2f2':s.riskLevel==='中'?'#fffbeb':'#f0fdf4'};color:${s.riskLevel==='高'?'#dc2626':s.riskLevel==='中'?'#d97706':'#16a34a'}">风险${s.riskLevel}</span>
        ${s.tags.map(t => `<span class="tag" style="cursor:default">${t}</span>`).join('')}
      </div>
      <div class="advice" style="margin-top:8px;padding:8px 12px;background:#f8fafc;border-radius:6px;font-size:12px;color:#475569;line-height:1.7">
        <div>🟢 买入：<b>${s.buyTiming}</b>（持有 ${s.holdingPeriod}）</div>
        <div>🔴 卖出：${s.sellTiming}</div>
        <div>🛡 止损：${s.stopLoss} ｜ 止盈：${s.takeProfit}</div>
      </div>
    </div>`).join('');

  // 分页
  const totalPages = Math.ceil(data.total / data.pageSize);
  const pg = document.getElementById('pagination');
  pg.innerHTML = `
    <button ${state.page<=1?'disabled':''} onclick="goPage(${state.page-1})">上一页</button>
    <span>第 ${state.page} / ${totalPages} 页 · 共 ${data.total.toLocaleString()} 条</span>
    <button ${state.page>=totalPages?'disabled':''} onclick="goPage(${state.page+1})">下一页</button>`;
}

function goPage(p) { state.page = p; refresh(); }

// 绑定工具栏
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; state.page=1; refresh(); });
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; refresh(); });
document.getElementById('order').addEventListener('change', e => { state.order = e.target.value; refresh(); });
document.getElementById('minUsage').addEventListener('change', e => { state.minUsage = e.target.value; state.page=1; refresh(); });
document.getElementById('reset').onclick = () => {
  state.tags.clear(); state.category=''; state.q=''; state.page=1;
  document.getElementById('q').value='';
  refresh();
};

loadMeta();
refresh();
</script>
</body>
</html>
